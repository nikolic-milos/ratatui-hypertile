name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default features
            flags: ""
          - name: all features
            flags: --all-features
          - name: no default features
            flags: --no-default-features
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests (${{ matrix.name }})
        run: cargo test --locked --workspace ${{ matrix.flags }}

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built per package so one crate's dev-dependencies can't enable
      # features another crate's examples rely on.
      - run: cargo build --locked -p ratatui-hypertile --examples
      - run: cargo build --locked -p ratatui-hypertile-extras --examples

  wasm:
    name: Wasm (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm32-wasip2, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p ratatui-hypertile --lib --all-features --target ${{ matrix.target }}
      - run: cargo check --locked -p ratatui-hypertile-extras --lib --no-default-features --target ${{ matrix.target }}
      - run: cargo check --locked -p ratatui-hypertile-extras --lib --no-default-features --features serde --target ${{ matrix.target }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --workspace --all-features --no-deps

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-features
